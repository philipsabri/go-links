[project]
name = "go-links"
version = "0.1.0"
description = "Simple go links app"
readme = "README.md"
authors = [
    { name = "Philipsabri", email = "philipsabri@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncio>=4.0.0",
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
